<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nord.West — магазин одежды</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F2F0;--card:#FFFFFF;--ink:#14181F;--mute:#5B6270;--line:#D9DCE0;--acc:#2B3FD6;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#1A1E27;--ink:#EEF0F2;--mute:#9AA2B1;--line:#2B313D;--acc:#8794FF;--onacc:#101319}}
:root[data-theme="dark"]{--bg:#101319;--card:#1A1E27;--ink:#EEF0F2;--mute:#9AA2B1;--line:#2B313D;--acc:#8794FF;--onacc:#101319}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font:700 22px Unbounded,sans-serif;letter-spacing:.02em;margin-right:auto}
.gtabs{display:flex;gap:4px}
.gtabs button,.cats button,.chips button{background:none;border:0}
.gtabs button{font:500 14px Unbounded,sans-serif;padding:10px 16px;border-radius:99px}
.gtabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.icon{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:700}
.hero{max-width:1200px;margin:auto;padding:56px 20px 28px}
.hero h1{font:700 clamp(40px,9vw,112px)/.95 Unbounded,sans-serif;letter-spacing:-.03em;margin:0;overflow-wrap:anywhere}
.hero p{max-width:46ch;color:var(--mute);margin:20px 0 0}
.cats{max-width:1200px;margin:auto;padding:0 20px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
.cats button{padding:14px 14px;white-space:nowrap;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-1px}
.cats button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
.chips{max-width:1200px;margin:auto;padding:18px 20px 6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips span{color:var(--mute);font-size:14px;margin-right:4px}
.chips button{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px;background:var(--card)}
.chips button[aria-pressed=true]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.count{max-width:1200px;margin:auto;padding:8px 20px;color:var(--mute);font-size:14px}
.grid{max-width:1200px;margin:auto;padding:8px 20px 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.p{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:4/5;display:grid;place-items:center}
.pic svg{width:58%;fill:rgba(255,255,255,.88);stroke:rgba(0,0,0,.18);stroke-width:1.5}
.info{padding:14px;display:flex;flex-direction:column;gap:2px;flex:1}
.info b{font-weight:700}.info small{color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px}
.add{background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:7px 14px;font-size:14px;font-weight:700}
.empty{grid-column:1/-1;padding:48px 0;color:var(--mute)}
#cart{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);background:var(--card);border-left:1px solid var(--line);z-index:9;transform:translateX(100%);transition:transform .25s;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;display:flex;flex-direction:column;gap:12px}
#cart.open{transform:none}
#cart ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
#cart li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.buy{background:var(--acc);color:var(--onacc);border:0;border-radius:6px;padding:14px;font-weight:700}
footer{border-top:1px solid var(--line);padding:28px 20px;text-align:center;color:var(--mute);font-size:14px}
@media(max-width:640px){.bar{flex-wrap:wrap}.gtabs{order:3;width:100%}.gtabs button{flex:1;padding:10px 6px;font-size:13px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
<div class="logo">Nord.West</div>
<div class="gtabs" role="tablist" id="gt"></div>
<button class="icon" id="cb" aria-label="Открыть корзину">Корзина · <span id="cn">0</span></button>
</div></header>

<section class="hero">
<h1 id="ht">Вся коллекция</h1>
<p id="hp">Одежда и обувь на каждый день: от базовых футболок до пальто. Выберите раздел, затем тип вещи и стиль.</p>
</section>

<nav class="cats" role="tablist" id="ct" aria-label="Категории"></nav>
<div class="chips" id="st" aria-label="Стиль"></div>
<div class="count" id="cc"></div>
<main class="grid" id="gr"></main>
<footer>Nord.West · Доставка по Украине · Возврат 30 дней</footer>

<aside id="cart" aria-label="Корзина">
<div style="display:flex;justify-content:space-between;align-items:center"><b style="font:700 18px Unbounded,sans-serif">Корзина</b><button class="icon" id="cx">Закрыть</button></div>
<ul id="cl"></ul>
<div style="display:flex;justify-content:space-between"><span>Итого</span><b id="ctot">0 ₴</b></div>
<button class="buy" id="by">Оформить заказ</button>
</aside>

<script>
var G=[["all","Всё"],["w","Женское"],["m","Мужское"]];
var C=[["all","Все вещи"],["tee","Футболки"],["hood","Худи и свитеры"],["jack","Куртки"],["pants","Брюки и джинсы"],["dress","Платья и юбки"],["shoes","Обувь"],["acc","Аксессуары"]];
var S=[["all","Все стили"],["casual","Кэжуал"],["sport","Спорт"],["classic","Классика"],["street","Стрит"]];
var CT={tee:"Футболка",hood:"Худи",jack:"Куртка",pants:"Брюки",dress:"Платье",shoes:"Обувь",acc:"Аксессуар"};
var ST={casual:"Кэжуал",sport:"Спорт",classic:"Классика",street:"Стрит"};
var HD={all:["Вся коллекция","Одежда и обувь на каждый день: от базовых футболок до пальто. Выберите раздел, затем тип вещи и стиль."],w:["Женское","Платья, верхняя одежда, обувь и базовые вещи для женского гардероба."],m:["Мужское","Футболки, куртки, брюки и обувь для мужского гардероба."]};
var P=[
["Футболка из плотного хлопка","tee","u","casual",890,"#8FA3B8"],["Oversize-футболка с принтом","tee","u","street",1090,"#2B2F3A"],["Спортивная футболка Dry","tee","m","sport",990,"#C86B3C"],["Приталенная футболка","tee","w","classic",850,"#C9A9A6"],
["Худи на молнии","hood","u","street",2490,"#3E4A5C"],["Свитшот Basic","hood","m","casual",1790,"#7C8A6E"],["Кашемировый джемпер","hood","w","classic",3290,"#B7A99A"],["Спортивное худи Run","hood","w","sport",2190,"#5B7F95"],
["Бомбер Core","jack","m","street",4290,"#4A5A3C"],["Тренч классический","jack","w","classic",5490,"#A88B6A"],["Пуховик лёгкий","jack","u","casual",5990,"#33415C"],["Ветровка Trail","jack","m","sport",3490,"#D1873E"],
["Джинсы прямого кроя","pants","m","casual",2290,"#4F6D8F"],["Брюки со стрелками","pants","w","classic",2490,"#2F3440"],["Джоггеры Tech","pants","m","sport",1990,"#5E6670"],["Карго широкие","pants","u","street",2590,"#6F7A5A"],
["Платье-рубашка","dress","w","casual",2890,"#9BB1C4"],["Вечернее платье","dress","w","classic",4990,"#4A2E48"],["Юбка плиссе","dress","w","classic",2190,"#8E6F7C"],["Платье-майка спорт","dress","w","sport",1690,"#6BA39A"],
["Кеды белые","shoes","u","casual",2790,"#C9CDD2"],["Беговые кроссовки","shoes","u","sport",3990,"#E2573B"],["Лоферы кожаные","shoes","m","classic",4590,"#6B4A36"],["Ботинки на платформе","shoes","w","street",4290,"#25272D"],["Туфли-лодочки","shoes","w","classic",3790,"#A33B4E"],
["Кепка Nord.West","acc","u","street",690,"#3C5E8C"],["Кожаный ремень","acc","m","classic",990,"#5A3F2C"],["Сумка-шоппер","acc","w","casual",1490,"#B9A27E"],["Рюкзак городской","acc","u","sport",2190,"#394150"]];
var IC={tee:"M30 14l-20 12 8 14 8-5v46h32V35l8 5 8-14-20-12c-2 6-8 9-14 9s-12-3-14-9z",
hood:"M28 16l-20 14 7 14 9-5v45h52V39l9 5 7-14-20-14c-3 8-9 10-16 10s-13-2-16-10z",
jack:"M32 12l-24 16 8 16 8-5v46h56V39l8 5 8-16-24-16-6 10v66h-4V22z",
pants:"M28 10h44l6 82H56L50 40l-6 52H22z",
dress:"M38 10h24l4 24 14 56H20l14-56z",
shoes:"M8 56c12 0 20-6 24-16l14 6c6 3 14 5 24 6 10 2 14 6 14 14v6H8z",
acc:"M30 44h40l8 36H22zM38 44c0-16 24-16 24 0"};
var s={g:"all",c:"all",s:"all"},cart=[];
function $(i){return document.getElementById(i)}
function fmt(n){return n.toLocaleString("uk-UA")+" ₴"}
function tabs(el,list,key,role){el.innerHTML="";list.forEach(function(x){var b=document.createElement("button");b.textContent=x[1];
if(role){b.setAttribute("role","tab");b.setAttribute("aria-selected",s[key]==x[0])}else b.setAttribute("aria-pressed",s[key]==x[0]);
b.onclick=function(){s[key]=x[0];render()};el.appendChild(b)})}
function render(){
tabs($("gt"),G,"g",1);tabs($("ct"),C,"c",1);
var st=$("st");st.innerHTML="<span>Стиль:</span>";var tmp=document.createElement("div");tabs(tmp,S,"s",0);while(tmp.firstChild)st.appendChild(tmp.firstChild);
$("ht").textContent=HD[s.g][0];$("hp").textContent=HD[s.g][1];
var l=P.map(function(p,i){return{p:p,i:i}}).filter(function(o){var p=o.p;return(s.g=="all"||p[2]=="u"||p[2]==s.g)&&(s.c=="all"||p[1]==s.c)&&(s.s=="all"||p[3]==s.s)});
$("cc").textContent="Найдено: "+l.length;
$("gr").innerHTML=l.length?l.map(function(o){var p=o.p;return '<article class="p"><div class="pic" style="background:'+p[5]+'"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="'+IC[p[1]]+'"/></svg></div><div class="info"><b>'+p[0]+'</b><small>'+CT[p[1]]+' · '+ST[p[3]]+' · '+(p[2]=="u"?"унисекс":p[2]=="w"?"женское":"мужское")+'</small><div class="row"><span>'+fmt(p[4])+'</span><button class="add" data-i="'+o.i+'">В корзину</button></div></div></article>'}).join(""):'<div class="empty">Ничего не найдено. Выберите другой стиль или раздел.</div>';
document.querySelectorAll(".add").forEach(function(b){b.onclick=function(){cart.push(+b.dataset.i);drawCart();b.textContent="Добавлено";setTimeout(function(){b.textContent="В корзину"},900)}})}
function drawCart(){$("cn").textContent=cart.length;
$("cl").innerHTML=cart.length?cart.map(function(i,k){return '<li><span>'+P[i][0]+'</span><span>'+fmt(P[i][4])+' <button class="icon" data-k="'+k+'" aria-label="Убрать">×</button></span></li>'}).join(""):"<li>Корзина пуста. Добавьте вещь из каталога.</li>";
$("ctot").textContent=fmt(cart.reduce(function(a,i){return a+P[i][4]},0));
document.querySelectorAll("#cl [data-k]").forEach(function(b){b.onclick=function(){cart.splice(+b.dataset.k,1);drawCart()}})}
$("cb").onclick=function(){$("cart").classList.add("open")};
$("cx").onclick=function(){$("cart").classList.remove("open")};
$("by").onclick=function(){if(cart.length){alert("Это демо-сайт: оплата пока не подключена.")}};
render();drawCart();
</script>
</body>
</html>

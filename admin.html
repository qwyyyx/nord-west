<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Редактор каталога</title>
<style>
:root{--bg:#F1F2F0;--card:#fff;--ink:#14181F;--mute:#5B6270;--line:#D9DCE0;--acc:#2B3FD6;--onacc:#fff;--bad:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#101319;--card:#1A1E27;--ink:#EEF0F2;--mute:#9AA2B1;--line:#2B313D;--acc:#8794FF;--onacc:#101319;--bad:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:3}
.w{max-width:1100px;margin:auto;padding:12px 16px}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top h1{font-size:18px;margin:0 auto 0 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.hint{color:var(--mute);font-size:13px;margin:8px 0 0}
.dirty{color:var(--bad);font-weight:600}
.tools{display:flex;gap:10px;margin-top:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0;display:grid;gap:10px;grid-template-columns:2fr 1fr 1fr 1fr}
.item label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
.wide{grid-column:span 2}
.chk{flex-direction:row!important;align-items:center;gap:8px!important;font-size:14px!important;color:var(--ink)!important}
.chk input{width:auto}
.del{color:var(--bad)}
.col{height:36px;padding:2px}
.empty{padding:40px 0;color:var(--mute);text-align:center}
@media(max-width:720px){.item{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}
</style>
</head>
<body>
<header><div class="w">
<div class="top">
<h1>Редактор каталога</h1>
<label class="btn">Открыть файл<input type="file" id="file" accept=".json,application/json" hidden></label>
<button class="btn" id="add">+ Товар</button>
<button class="btn pri" id="save">Скачать products.json</button>
</div>
<p class="hint" id="st">Загружаю каталог…</p>
<div class="tools"><input id="q" type="search" placeholder="Поиск по названию"></div>
</div></header>
<main class="w" id="list"></main>

<script>
var DB=null,dirty=false;
function $(i){return document.getElementById(i)}
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function status(t,d){$("st").innerHTML=d?'<span class="dirty">'+t+'</span>':esc(t)}
function opts(list,cur){return list.map(function(o){return '<option value="'+esc(o.id)+'"'+(o.id==cur?' selected':'')+'>'+esc(o.name)+'</option>'}).join("")}
function draw(){
var q=$("q").value.trim().toLowerCase(),n=0;
var html=DB.products.map(function(p,i){
if(q&&p.name.toLowerCase().indexOf(q)<0)return"";n++;
var g=[{id:"w",name:"Женское"},{id:"m",name:"Мужское"},{id:"u",name:"Унисекс"}];
return '<div class="item" data-i="'+i+'">'+
'<label class="wide">Название<input data-f="name" value="'+esc(p.name)+'"></label>'+
'<label>Цена, '+esc(DB.shop.currency)+'<input data-f="price" type="number" min="0" value="'+esc(p.price)+'"></label>'+
'<label>Цвет<input class="col" data-f="color" type="color" value="'+esc(p.color||"#888888")+'"></label>'+
'<label>Категория<select data-f="cat">'+opts(DB.categories,p.cat)+'</select></label>'+
'<label>Раздел<select data-f="gender">'+opts(g,p.gender)+'</select></label>'+
'<label>Стиль<select data-f="style">'+opts(DB.styles,p.style)+'</select></label>'+
'<label>Фото (путь, напр. img/tee1.jpg)<input data-f="image" value="'+esc(p.image)+'"></label>'+
'<label class="chk wide"><input data-f="soldOut" type="checkbox"'+(p.soldOut?' checked':'')+'> Нет в наличии</label>'+
'<button class="btn del" data-del="'+i+'">Удалить</button></div>'}).join("");
$("list").innerHTML=html||'<div class="empty">Ничего не найдено.</div>';
status("Товаров: "+DB.products.length+(dirty?". Есть несохранённые изменения: скачайте файл.":""),dirty)}
$("list").addEventListener("input",function(e){var el=e.target,row=el.closest(".item");if(!row||!el.dataset.f)return;
var p=DB.products[+row.dataset.i],f=el.dataset.f;
p[f]=el.type=="checkbox"?el.checked:f=="price"?Number(el.value)||0:el.value;dirty=true;status("Есть несохранённые изменения: скачайте файл.",true)});
$("list").addEventListener("click",function(e){var d=e.target.dataset.del;if(d==null)return;
if(confirm("Удалить «"+DB.products[+d].name+"»?")){DB.products.splice(+d,1);dirty=true;draw()}});
$("q").oninput=draw;
$("add").onclick=function(){DB.products.unshift({id:"p"+Date.now(),name:"Новый товар",cat:DB.categories[0].id,gender:"u",style:DB.styles[0].id,price:1000,color:"#888888",image:"",soldOut:false});dirty=true;$("q").value="";draw();window.scrollTo(0,0)};
$("save").onclick=function(){var b=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}),a=document.createElement("a");
a.href=URL.createObjectURL(b);a.download="products.json";a.click();dirty=false;draw();status("Файл скачан. Загрузите его в репозиторий GitHub, заменив старый products.json.")};
$("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{DB=JSON.parse(r.result);if(!DB.products)throw 0;dirty=false;draw()}catch(x){status("Не удалось прочитать файл.",true)}};r.readAsText(f)};
window.onbeforeunload=function(){return dirty?"Есть несохранённые изменения":undefined};
fetch("products.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){DB=d;draw()}).catch(function(){DB={shop:{name:"",currency:"₴"},genders:[],categories:[{id:"tee",name:"Футболки"}],styles:[{id:"y2k",name:"Y2K"}],products:[]};draw();status("Не удалось загрузить products.json автоматически. Нажмите «Открыть файл» и выберите его.",true)});
</script>
</body>
</html>
